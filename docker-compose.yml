name: bloxdance

services:
  bloxdance:
    image: ghcr.io/a01751347/blox:latest
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: '3000'
      DB_PATH: /data/bloxdance.sqlite
    ports:
      - '${HTTP_PORT:-3000}:3000'
    volumes:
      - bloxdance-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  streamer:
    profiles: ['stream']
    build: ./deploy/streamer
    restart: unless-stopped
    env_file: .env
    shm_size: '2gb'
    depends_on:
      bloxdance:
        condition: service_healthy
    # GPU Intel/AMD (VAAPI): descomenta y usa ENCODER=h264_vaapi
    # devices:
    #   - /dev/dri:/dev/dri
    # GPU NVIDIA: instala nvidia-container-toolkit, usa ENCODER=h264_nvenc y descomenta
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video, compute, utility]

volumes:
  bloxdance-data:
